<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Lista de Clientes</h2>
        <a href="/chamados/dashboard" class="btn btn-secondary mb-3">Voltar ao Dashboard</a>
        <table class="table table-striped bg-white shadow-sm">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cli : ${clientes}">
                    <td th:text="${cli.id}">1</td>
                    <td th:text="${cli.nome}">João Silva</td>
                    <td th:text="${cli.email}">joao@email.com</td>
                    <td th:text="${cli.telefone}">(47) 99999-9999</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
