<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Categoria - Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="fas fa-headset me-2"></i>Sistema Chamados</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/categorias">Categorias</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">
                        <i class="fas fa-plus-circle me-2 text-primary"></i>Registar Nova Categoria
                    </div>
                    <div class="card-body">
                        <!-- Seguindo a documentação: th:action e th:object vinculados ao DTO -->
                        <form th:action="@{/categorias/salvar}" th:object="${categoriaRequest}" method="post">
                            
                            <div class="mb-3">
                                <label for="nome" class="form-label fw-bold">Nome da Categoria</label>
                                <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Ex: Software, Rede..." required>
                                <!-- Exibição de erro oficial do Spring caso a validação falhe -->
                                <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro no nome</div>
                            </div>

                            <div class="mb-3">
                                <label for="descricao" class="form-label fw-bold">Descrição</label>
                                <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="3" placeholder="Breve descrição..."></textarea>
                                <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">Erro na descrição</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="/categorias" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i> Cancelar</a>
                                <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Guardar Categoria</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
