<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Técnicos - Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="fas fa-headset me-2"></i>Sistema Chamados</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/tecnicos">Técnicos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container">
        <div class="row mb-4">
            <div class="col-md-12">
                <h2><i class="fas fa-user-shield me-2 text-primary"></i>Equipa de Técnicos</h2>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${tecnicos != null and #lists.isEmpty(tecnicos)}">
                            <td colspan="4" class="text-center text-muted">Nenhum técnico registado.</td>
                        </tr>
                        <tr th:each="tec : ${tecnicos}">
                            <td th:text="${tec.id}">1</td>
                            <td th:text="${tec.nome}">Carlos Souza</td>
                            <td th:text="${tec.email}">carlos@email.com</td>
                            <td th:text="${tec.perfil}">ADMIN</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
