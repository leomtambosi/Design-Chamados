<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registar Técnico - Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fas fa-user-shield me-2"></i>Gestão de Técnico
                    </div>
                    <div class="card-body">
                        <form th:action="${tecnicoId == null} ? @{/tecnicos/salvar} : @{/tecnicos/atualizar/{id}(id=${tecnicoId})}" 
                              th:object="${tecnicoRequest}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nome</label>
                                <input type="text" class="form-control" th:field="*{nome}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">E-mail</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Perfil</label>
                                <select class="form-select" th:field="*{perfil}" required>
                                    <option value="">Selecione o Perfil</option>
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="TECNICO">TECNICO</option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="/tecnicos" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i> Voltar</a>
                                <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
