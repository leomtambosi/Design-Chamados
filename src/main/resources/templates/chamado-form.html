<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Chamado - Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fas fa-ticket-alt me-2"></i>Abrir Novo Chamado
                    </div>
                    <div class="card-body">
                        <form th:action="@{/chamados/salvar}" th:object="${chamadoRequest}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Título</label>
                                <input type="text" class="form-control" th:field="*{titulo}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Descrição</label>
                                <textarea class="form-control" th:field="*{descricao}" rows="3" required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Cliente</label>
                                    <select class="form-select" th:field="*{clienteId}" required>
                                        <option value="">Selecione...</option>
                                        <option th:each="cli : ${clientes}" th:value="${cli.id}" th:text="${cli.nome}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Técnico</label>
                                    <select class="form-select" th:field="*{tecnicoId}">
                                        <option value="">Não atribuído</option>
                                        <option th:each="tec : ${tecnicos}" th:value="${tec.id}" th:text="${tec.nome}"></option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Categoria</label>
                                    <select class="form-select" th:field="*{categoriaId}" required>
                                        <option value="">Selecione...</option>
                                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Prioridade</label>
                                <select class="form-select" th:field="*{prioridade}" required>
                                    <option value="BAIXA">BAIXA</option>
                                    <option value="MEDIA">MEDIA</option>
                                    <option value="ALTA">ALTA</option>
                                </select>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="/chamados" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i> Voltar</a>
                                <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Abrir Chamado</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
