<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chamados - Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="fas fa-headset me-2"></i>Sistema Chamados</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tecnicos">Técnicos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/chamados">Chamados</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/comentarios">Comentários</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container">
        <div class="row mb-4">
            <div class="col-md-12">
                <h2><i class="fas fa-ticket-alt me-2 text-primary"></i>Lista de Chamados</h2>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Cliente</th>
                            <th>Técnico</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${chamados != null and #lists.isEmpty(chamados)}">
                            <td colspan="6" class="text-center text-muted">Nenhum chamado registado.</td>
                        </tr>
                        <tr th:each="c : ${chamados}">
                            <td th:text="${c.id}">1</td>
                            <td th:text="${c.titulo}">Erro no sistema</td>
                            <td th:text="${c.clienteNome}">João Silva</td>
                            <td th:text="${c.tecnicoNome != null ? c.tecnicoNome : 'Não atribuído'}">Carlos Souza</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${c.prioridade}">MEDIA</span>
                            </td>
                            <td>
                                <span class="badge bg-primary" th:text="${c.status}">ABERTO</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
