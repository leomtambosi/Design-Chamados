<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard"><i class="fas fa-headset me-2"></i>Painel Chamados</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tecnicos">Técnicos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/chamados">Chamados</a></li>
                    <li class="nav-item"><a class="nav-link" href="/comentarios">Comentários</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="fas fa-ticket-alt me-2 text-primary"></i>Lista de Chamados</h2>
            <a href="/chamados/novo" class="btn btn-success btn-sm">
                <i class="fas fa-plus me-1"></i> Abrir Novo Chamado
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Data Abertura</th>
                                <th>Status</th>
                                <th>Prioridade</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="chamado : ${chamados}">
                                <td th:text="${chamado.id}">1</td>
                                <td>
                                    <a th:href="@{/chamados/{id}(id=${chamado.id})}" th:text="${chamado.titulo}" class="text-decoration-none fw-bold">Título</a>
                                </td>
                                <td th:text="${chamado.dataAbertura}">2026-10-29</td>
                                <td><span class="badge bg-primary" th:text="${chamado.status}">ABERTO</span></td>
                                <td><span class="badge bg-warning text-dark" th:text="${chamado.prioridade}">MEDIA</span></td>
                                <td class="text-center">
                                    <a th:href="@{/chamados/{id}(id=${chamado.id})}" class="btn.primary btn btn-info btn-sm text-white me-1" title="Ver Detalhes">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                    <a th:href="@{/chamados/excluir/{id}(id=${chamado.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja excluir?')">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${chamados == null or #lists.isEmpty(chamados)}">
                                <td colspan="6" class="text-center text-muted py-4">Nenhum chamado cadastrado no momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
