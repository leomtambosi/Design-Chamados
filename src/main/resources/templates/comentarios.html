<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Chamados</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegação Superior (Menu para todas as entidades) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Painel Chamados</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="/web/chamados">Chamados</a></li>
                    <li class="nav-item"><a class="nav-link" href="/web/categorias">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/web/clientes">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/web/tecnicos">Técnicos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/web/comentarios">Comentários</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Lista de Chamados</h2>
            <a href="/dashboard" class="btn btn-secondary">Ver Dashboard</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Data Abertura</th>
                                <th>Status</th>
                                <th>Prioridade</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Loop do Thymeleaf para percorrer a lista de chamados enviada pelo Controller -->
                            <tr th:each="chamado : ${chamados}">
                                <td th:text="${chamado.id}">1</td>
                                <td th:text="${chamado.titulo}">Título do Chamado</td>
                                <td th:text="${chamado.dataAbertura}">2026-10-29</td>
                                <td>
                                    <span class="badge bg-primary" th:text="${chamado.status}">ABERTO</span>
                                </td>
                                <td>
                                    <span class="badge bg-warning text-dark" th:text="${chamado.prioridade}">MEDIA</span>
                                </td>
                            </tr>
                            <!-- Mensagem caso a lista esteja vazia -->
                            <tr th:if="${#lists.isEmpty(chamados)}">
                                <td colspan="5" class="text-center text-muted">Nenhum chamado cadastrado no momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
