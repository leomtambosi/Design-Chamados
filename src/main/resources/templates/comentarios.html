<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comentários - Sistema de Chamados</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegação Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard"><i class="fas fa-headset me-2"></i>Painel Chamados</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/chamados">Chamados</a></li>
                    <li class="nav-item"><a class="nav-link" href="/categorias">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clientes">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tecnicos">Técnicos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/comentarios">Comentários</a></li>
                    
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2><i class="fas fa-comments me-2 text-primary"></i>Lista de Comentários</h2>
            <a href="/dashboard" class="btn btn-secondary btn-sm"><i class="fas fa-tachometer-alt me-1"></i> Ver Dashboard</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Autor</th>
                                <th>Texto</th>
                                <th>Data de Criação</th>
                                <th>ID do Chamado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Loop do Thymeleaf para os comentários -->
                            <tr th:each="com : ${comentarios}">
                                <td th:text="${com.id}">1</td>
                                <td>
                                    <span class="fw-bold text-primary" th:text="${com.autor}">Autor</span>
                                </td>
                                <td th:text="${com.texto}">Texto do comentário...</td>
                                <td th:text="${com.dataCriacao}">2026-11-09</td>
                                <td>
                                    <a th:href="@{/chamados/{id}(id=${com.chamado.id})}" class="badge bg-secondary text-decoration-none" th:text="${com.chamado.id}">Ver Chamado</a>
                                </td>
                            </tr>
                            <!-- Mensagem caso a lista esteja vazia -->
                            <tr th:if="${comentarios == null or #lists.isEmpty(comentarios)}">
                                <td colspan="5" class="text-center text-muted py-4">Nenhum comentário registado no momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
