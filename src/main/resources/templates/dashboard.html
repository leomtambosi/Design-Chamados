<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema de Chamados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Painel de Controle</h1>
        <p>Total de Chamados: <strong th:text="${dashboard.totalChamados}">0</strong></p>
        
        <!-- Listagem dinâmica de entidades integradas -->
        <ul class="list-group" th:each="chamado : ${dashboard.ultimosChamados}">
            <li class="list-group-item" th:text="${chamado.titulo}">Título do Chamado</li>
        </ul>
    </div>
</body>
</html>
